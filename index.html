<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexiora — Next-generation intelligence</title>
<meta name="description" content="Nexiora is a Mistral-powered conversational AI assistant that can search the web when it needs to.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26">
        <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
        <circle cx="16" cy="4" r="2.1" fill="currentColor" opacity="0.85"/>
        <circle cx="27.8" cy="12" r="2.1" fill="currentColor" opacity="0.65"/>
        <circle cx="23.5" cy="26.5" r="2.1" fill="currentColor" opacity="0.65"/>
        <circle cx="4.2" cy="12" r="2.1" fill="currentColor" opacity="0.65"/>
        <circle cx="8.5" cy="26.5" r="2.1" fill="currentColor" opacity="0.65"/>
        <path d="M16 16L16 4M16 16L27.8 12M16 16L23.5 26.5M16 16L4.2 12M16 16L8.5 26.5"
              stroke="currentColor" stroke-width="1" opacity="0.35"/>
      </svg>
    </span>
    <div class="brand-text">
      <span class="brand-name">Nexiora</span>
      <span class="brand-tagline">Next-generation intelligence</span>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="topbar-status" id="topbarStatus">
      <span class="dot dot-idle" id="statusDot"></span>
      <span id="statusText">Ready</span>
    </div>
    <button type="button" class="reset-btn" id="resetBtn" title="Reset conversation">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none">
        <path d="M4 10a6 6 0 1 1 1.8 4.3M4 10V5.5M4 10h4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Reset</span>
    </button>
  </div>
</header>

<main class="console" id="console">
  <div class="chat-shell">

    <div class="empty-state" id="emptyState">
      <h1 class="empty-heading">What's on your mind?</h1>
      <p class="empty-sub">Ask anything. Nexiora will search the web on its own when a question needs current or specific information.</p>
      <div class="example-row" id="exampleRow">
        <button type="button" class="example-chip" data-topic="What's the latest news in AI this week?">Latest AI news</button>
        <button type="button" class="example-chip" data-topic="Explain how solid-state batteries work">Solid-state batteries</button>
        <button type="button" class="example-chip" data-topic="What's the current price of Bitcoin?">Bitcoin price</button>
      </div>
    </div>

    <div class="chat-log" id="chatLog"></div>

  </div>
</main>

<div class="composer-bar">
  <div class="composer-inner">

    <div class="error-banner" id="errorBanner" hidden>
      <span class="error-icon" aria-hidden="true">!</span>
      <span id="errorText"></span>
    </div>

    <form class="query-form" id="queryForm" autocomplete="off">
      <input
        type="text"
        id="topicInput"
        class="query-input"
        placeholder="Message Nexiora..."
        maxlength="4000"
        required
      >
      <button type="submit" class="run-btn" id="runBtn">
        <svg class="run-btn-icon" viewBox="0 0 20 20" width="16" height="16" fill="none">
          <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

  </div>
</div>

<footer class="footer">
  <span>Nexiora</span>
  <span class="footer-dot" aria-hidden="true">&middot;</span>
  <span class="footer-credit">Developed by Nayan Pote</span>
</footer>

<script src="script.js"></script>
</body>
</html>
